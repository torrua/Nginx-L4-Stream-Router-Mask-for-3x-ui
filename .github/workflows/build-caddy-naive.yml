name: Build Caddy NaïveProxy Binaries

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Tag of GitHub Release to upload assets to (e.g. v8.1.0, leave empty to only build artifacts)'
        required: false
        default: 'v8.1.0'
        type: string
  release:
    types: [published]
  push:
    paths:
      - '.github/workflows/build-caddy-naive.yml'
      - 'compose/naiveproxy/**'

permissions:
  contents: write

jobs:
  build:
    name: Build caddy-naive (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with NaïveProxy & Cloudflare DNS
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          xcaddy build \
            --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive \
            --with github.com/caddy-dns/cloudflare \
            --output dist/caddy-naive

          cd dist
          tar -czf caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz caddy-naive
          sha256sum caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.upload_to_release || github.ref_name }}
          files: |
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
