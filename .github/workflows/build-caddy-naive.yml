name: Build Caddy NaïveProxy Binaries

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Tag of GitHub Release to upload assets to (e.g. v9.1.0, leave empty to only build artifacts)'
        required: false
        default: 'v9.1.0'
        type: string
  release:
    types: [published]
  push:
    paths:
      - '.github/workflows/build-caddy-naive.yml'
      - 'compose/naiveproxy/**'

permissions:
  contents: write

jobs:
  build:
    name: Build caddy-naive (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.26'
          cache: false

      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with NaïveProxy & Cloudflare DNS
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          xcaddy build \
            --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive \
            --with github.com/caddy-dns/cloudflare \
            --output dist/caddy-naive

          cd dist
          tar -czf caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz caddy-naive
          sha256sum caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          ls -lh

      - name: Build DNSTT Server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/dnstt-tmp
          go install -ldflags='-s -w' www.bamsoftware.com/git/dnstt.git/dnstt-server@latest
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            cp "$(go env GOPATH)/bin/linux_arm64/dnstt-server" dist/dnstt-tmp/dnstt-server
          else
            cp "$(go env GOPATH)/bin/dnstt-server" dist/dnstt-tmp/dnstt-server
          fi
          cd dist/dnstt-tmp
          tar -czf ../dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz dnstt-server
          cd ..
          rm -rf dnstt-tmp
          sha256sum dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          ls -lh

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            dist/dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.upload_to_release || github.ref_name }}
          files: |
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/caddy-naive-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            dist/dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/dnstt-server-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
