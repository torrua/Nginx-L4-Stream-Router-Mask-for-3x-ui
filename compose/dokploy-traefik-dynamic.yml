# ==============================================================================
# DOKPLOY TRAEFIK DYNAMIC CONFIGURATION FOR 3X-UI & VPN SERVICES
# ==============================================================================
# Поместите этот файл в директорию dynamic-конфигурации Traefik на сервере:
# /etc/dokploy/traefik/dynamic/vpn.yml
# Traefik автоматически подхватит его без перезагрузки и выпустит SSL!

http:
  routers:
    xui-panel:
      rule: "Host(`panel.yourdomain.online`)"
      entryPoints:
        - "websecure"
      service: "xui-panel-service"
      tls:
        certResolver: "letsencrypt"

    xui-sub:
      rule: "Host(`sub.yourdomain.online`)"
      entryPoints:
        - "websecure"
      service: "xui-sub-service"
      tls:
        certResolver: "letsencrypt"

    xray-xhttp:
      rule: "Host(`vless.yourdomain.online`)"
      entryPoints:
        - "websecure"
      service: "xray-xhttp-service"
      tls:
        certResolver: "letsencrypt"

  services:
    xui-panel-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:10443"

    xui-sub-service:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:55443"

    xray-xhttp-service:
      loadBalancer:
        servers:
          - url: "h2c://host.docker.internal:50443"

tcp:
  routers:
    reality-steal:
      entryPoints:
        - "websecure"
      rule: "HostSNI(`cdn.yourdomain.online`) || HostSNI(`reality.yourdomain.online`)"
      service: "reality-steal-service"
      tls:
        passthrough: true

    reality-steal-backup:
      entryPoints:
        - "websecure"
      rule: "HostSNI(`static.yourdomain.online`)"
      service: "reality-steal-backup-service"
      tls:
        passthrough: true

    reality-classic:
      entryPoints:
        - "websecure"
      rule: "HostSNI(`www.uni-frankfurt.de`) || HostSNI(`www.sap.com`) || HostSNI(`download.videolan.org`) || HostSNI(`www.siemens.com`) || HostSNI(`mirror.leaseweb.com`)"
      service: "reality-classic-service"
      tls:
        passthrough: true

  services:
    reality-steal-service:
      loadBalancer:
        servers:
          - address: "host.docker.internal:45443"

    reality-steal-backup-service:
      loadBalancer:
        servers:
          - address: "host.docker.internal:47443"

    reality-classic-service:
      loadBalancer:
        servers:
          - address: "host.docker.internal:46443"

